{% extends 'base.html' %}
{% block title %}Edit Weather Condition{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Edit Weather Condition</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% include 'includes/form.html' %}
                <a href="{% url 'weatherconditions-list' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
